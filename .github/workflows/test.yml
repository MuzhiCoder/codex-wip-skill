name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Snapshot tests
        run: python scripts/test_wip_snapshot.py
      - name: Validator tests
        run: python scripts/test_wip_validate.py
